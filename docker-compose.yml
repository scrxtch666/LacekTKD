services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    # Jediný zdroj proměnných je kořenový .env — docker compose ho načte
    # automaticky a hodnoty se doplní sem.
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      PORT: ${PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      ACCES_TOKEN_SECRET: ${ACCES_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      MAP_API: ${MAP_API}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/public/uploads
    networks:
      - traefik
      - db
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      # /api, /auth a /uploads jdou na backend — priority musí být vyšší
      # než u frontend routeru, jinak by je pohltilo pravidlo "/".
      - traefik.http.routers.lacektkd-api.rule=Host(`tvedomena.cz`) && (PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/uploads`))
      - traefik.http.routers.lacektkd-api.entrypoints=websecure
      - traefik.http.routers.lacektkd-api.tls.certresolver=letsencrypt
      - traefik.http.routers.lacektkd-api.priority=10
      - traefik.http.services.lacektkd-api.loadbalancer.server.port=3000

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.lacektkd-web.rule=Host(`tvedomena.cz`)
      - traefik.http.routers.lacektkd-web.entrypoints=websecure
      - traefik.http.routers.lacektkd-web.tls.certresolver=letsencrypt
      - traefik.http.routers.lacektkd-web.priority=1
      - traefik.http.services.lacektkd-web.loadbalancer.server.port=80

networks:
  traefik:
    external: true
    name: traefik_default
  # interní síť backend <-> db, na Traefik ani ven není napojená
  db:

volumes:
  uploads:
  db_data:
